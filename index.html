<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Biome Lab</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
  header { padding: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  canvas { image-rendering: pixelated; border: 1px solid #333; background: #000; }
  #chart { image-rendering: auto; width: 800px; height: 200px; }
  button, input { font: inherit; }
  #stats { font-variant-numeric: tabular-nums; padding: 6px; }
  #legend { font-size: 13px; display: flex; gap: 14px; padding-bottom: 6px; }
  footer { font-size: 12px; opacity: 0.6; padding: 8px; }
</style>
</head>
<body>
<header>
  <strong>Tiny Biome Lab</strong>
  <label>seed <input id="seed" size="10"></label>
  <button id="newSeed">new seed</button>
  <button id="pause">pause</button>
  <button id="csv">export csv</button>
  <label>speed <input id="speed" type="range" min="1" max="30" value="8"></label>
</header>
<canvas id="world" width="80" height="50" style="width:800px;height:500px"></canvas>
<div id="stats"></div>
<canvas id="chart" width="800" height="200"></canvas>
<div id="legend">
  <span style="color:#f0c850">grazers</span>
  <span style="color:#ff4d4d">predators</span>
  <span style="color:#7fd3ff">speed gene</span>
  <span style="color:#ff8fb1">sense gene</span>
  <span style="color:#b6ff7f">metabolism gene</span>
  <span style="opacity:0.6">each line scaled to its own range</span>
</div>
<footer>Same seed, same history. M2: genes mutate on breeding. M3: red predators hunt grazers; export csv for the full history.</footer>

<script>
// Seeded PRNG (mulberry32): same seed always gives the same world.
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const W = 80, H = 50;
const MAX_GRAZERS = 400;   // hard cap so the sim stays fast
const BREED_AT = 18;       // energy needed to breed
const BREED_COST = 8;      // energy the parent pays (the child starts with 8)
const REGROW = 0.006;     // grass regrowth per cell per tick
const CROWD_COST = 0.15;   // extra energy each grazer loses per tick at full population
const SAMPLE_EVERY = 5;    // record history every N ticks
const PRED_CAP = 30;       // hard cap on predators
const PRED_AT = 25;        // predator energy needed to breed
const PRED_COST = 12;      // energy a predator pays to breed (the child starts with 12)
const PRED_EAT = 6;        // energy a predator gains per grazer eaten
const HUNT_SUCCESS = 0.25; // chance a predator in reach actually lands a bite
const PRED_METAB = 0.4;    // energy a predator uses per tick, per speed point
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const chart = document.getElementById('chart');
const cctx = chart.getContext('2d');
const statsEl = document.getElementById('stats');
const seedInput = document.getElementById('seed');
const speedInput = document.getElementById('speed');
const pauseBtn = document.getElementById('pause');

let rng, grass, grazers, predators, tick, paused = false;
let births = 0, deaths = 0, eaten = 0, pDeaths = 0, history = [];

function hashSeed(str) {
  // Turns a text seed into a 32-bit number. Numbers pass through.
  if (/^\d+$/.test(str)) return parseInt(str, 10);
  let h = 2166136261;
  for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return h >>> 0;
}

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

// Child genes: each gene moves a little, with a small chance of a bigger jump.
function mutate(v, lo, hi, step) {
  const jump = rng() < 0.05 ? step * 3 : step;
  return clamp(v + (rng() * 2 - 1) * jump, lo, hi);
}

function newWorld(seedText) {
  seedInput.value = seedText;
  location.hash = seedText;
  rng = makeRng(hashSeed(seedText));
  grass = new Float32Array(W * H);
  for (let i = 0; i < grass.length; i++) grass[i] = rng();
  grazers = [];
  for (let i = 0; i < 60; i++) {
    grazers.push({
      x: Math.floor(rng() * W), y: Math.floor(rng() * H),
      energy: 10,
      speed: 1 + Math.floor(rng() * 2),   // gene: cells per tick (1..2)
      sense: 3 + Math.floor(rng() * 4),   // gene: how far it can see grass (3..6)
      metabolism: 0.08 + rng() * 0.08,    // gene: energy used per tick
    });
  }
  predators = [];
  for (let i = 0; i < 4; i++) {
    predators.push({
      x: Math.floor(rng() * W), y: Math.floor(rng() * H),
      energy: 12,
      speed: 1 + Math.floor(rng() * 2),   // gene: cells per tick (1..2), costs more energy when fast
      sense: 3 + Math.floor(rng() * 3),   // gene: how far it can smell a grazer (3..5)
    });
  }
  tick = 0;
  births = 0;
  deaths = 0;
  eaten = 0;
  pDeaths = 0;
  history = [];
  sample();
}

function wrap(v, max) { return (v + max) % max; }

// Shortest signed distance between two cells on the wrapped grid.
function wrapDelta(d, max) {
  d = ((d % max) + max) % max;
  return d > max / 2 ? d - max : d;
}

function step() {
  tick++;
  // Grass regrows slowly.
  for (let i = 0; i < grass.length; i++) grass[i] = Math.min(1, grass[i] + REGROW);

  const next = [];
  const babies = [];
  for (const g of grazers) {
    // Look around for the richest grass cell in sense range.
    let bestX = g.x, bestY = g.y, bestVal = -1;
    for (let dy = -g.sense; dy <= g.sense; dy++) {
      for (let dx = -g.sense; dx <= g.sense; dx++) {
        const x = wrap(g.x + dx, W), y = wrap(g.y + dy, H);
        const v = grass[y * W + x];
        if (v > bestVal) { bestVal = v; bestX = x; bestY = y; }
      }
    }
    // Move toward it, up to speed cells per tick.
    for (let s = 0; s < g.speed; s++) {
      if (g.x !== bestX) g.x = wrap(g.x + Math.sign(bestX - g.x), W);
      else if (g.y !== bestY) g.y = wrap(g.y + Math.sign(bestY - g.y), H);
    }
    // Eat what is here.
    const idx = g.y * W + g.x;
    const eaten = Math.min(grass[idx], 0.5);
    grass[idx] -= eaten;
    // Crowding: a full population costs everyone a little more energy each tick.
    g.energy += eaten * 2.5 - g.metabolism - CROWD_COST * grazers.length / MAX_GRAZERS;

    if (g.energy <= 0) { deaths++; continue; }

    // Breed when full: the child appears in a neighbouring cell with mutated genes.
    if (g.energy >= BREED_AT && grazers.length + babies.length < MAX_GRAZERS) {
      g.energy -= BREED_COST;
      births++;
      babies.push({
        x: wrap(g.x + Math.floor(rng() * 3) - 1, W),
        y: wrap(g.y + Math.floor(rng() * 3) - 1, H),
        energy: BREED_COST,
        speed: Math.round(mutate(g.speed, 1, 3, 0.5)),
        sense: Math.round(mutate(g.sense, 2, 8, 1)),
        metabolism: mutate(g.metabolism, 0.04, 0.2, 0.02),
      });
    }
    next.push(g);
  }
  grazers = next.concat(babies);
  predatorStep();
  if (tick % SAMPLE_EVERY === 0) sample();
}

// Predators hunt the nearest grazer they can smell, wander when there is none,
// eat anything within one cell, and breed when full.
function predatorStep() {
  const alive = [];
  const babies = [];
  for (const p of predators) {
    let target = null, bestD = Infinity;
    for (const g of grazers) {
      const d = Math.max(Math.abs(wrapDelta(g.x - p.x, W)), Math.abs(wrapDelta(g.y - p.y, H)));
      if (d <= p.sense && d < bestD) { bestD = d; target = g; }
    }
    for (let s = 0; s < p.speed; s++) {
      if (target) {
        const dx = wrapDelta(target.x - p.x, W), dy = wrapDelta(target.y - p.y, H);
        if (dx === 0 && dy === 0) break;
        if (Math.abs(dx) >= Math.abs(dy)) p.x = wrap(p.x + Math.sign(dx), W);
        else p.y = wrap(p.y + Math.sign(dy), H);
      } else {
        const r = rng();
        if (r < 0.25) p.x = wrap(p.x + 1, W);
        else if (r < 0.5) p.x = wrap(p.x - 1, W);
        else if (r < 0.75) p.y = wrap(p.y + 1, H);
        else p.y = wrap(p.y - 1, H);
      }
    }
    // Eat a grazer within one cell (the victim is removed at once, so no double meals).
    const i = grazers.findIndex(g =>
      Math.abs(wrapDelta(g.x - p.x, W)) <= 1 && Math.abs(wrapDelta(g.y - p.y, H)) <= 1);
    if (i >= 0 && rng() < HUNT_SUCCESS) { grazers.splice(i, 1); eaten++; p.energy += PRED_EAT; }

    p.energy -= PRED_METAB * p.speed;
    if (p.energy <= 0) { pDeaths++; continue; }
    // Cap check uses the old count, so survivors plus babies can never pass PRED_CAP.
    if (p.energy >= PRED_AT && predators.length + babies.length < PRED_CAP) {
      p.energy -= PRED_COST;
      babies.push({
        x: wrap(p.x + Math.floor(rng() * 3) - 1, W),
        y: wrap(p.y + Math.floor(rng() * 3) - 1, H),
        energy: PRED_COST,
        speed: Math.round(mutate(p.speed, 1, 2, 0.5)),
        sense: Math.round(mutate(p.sense, 2, 7, 1)),
      });
    }
    alive.push(p);
  }
  predators = alive.concat(babies);
}

function sample() {
  const n = grazers.length;
  const avg = (k) => n ? grazers.reduce((s, g) => s + g[k], 0) / n : 0;
  history.push({
    tick, n, pred: predators.length, births, deaths, eaten,
    speed: avg('speed'), sense: avg('sense'), metabolism: avg('metabolism'),
  });
  if (history.length > 2000) history.shift();
}

function draw() {
  const img = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const gr = grass[i];
    img.data[i * 4] = 20;
    img.data[i * 4 + 1] = 40 + gr * 180;
    img.data[i * 4 + 2] = 20;
    img.data[i * 4 + 3] = 255;
  }
  for (const g of grazers) {
    const i = (g.y * W + g.x) * 4;
    img.data[i] = 240; img.data[i + 1] = 200; img.data[i + 2] = 80;
  }
  for (const p of predators) {
    const i = (p.y * W + p.x) * 4;
    img.data[i] = 255; img.data[i + 1] = 70; img.data[i + 2] = 70;
  }
  ctx.putImageData(img, 0, 0);
  drawChart();
  const last = history[history.length - 1] || { speed: 0 };
  statsEl.textContent =
    `tick ${tick} | grazers ${grazers.length} | predators ${predators.length} | eaten ${eaten} | ` +
    `births ${births} | deaths ${deaths} | ` +
    `speed ${last.speed.toFixed(2)} sense ${last.sense.toFixed(2)} metabolism ${last.metabolism.toFixed(3)}`;
}

function drawChart() {
  const w = chart.width, h = chart.height, pad = 8;
  cctx.fillStyle = '#000';
  cctx.fillRect(0, 0, w, h);
  if (history.length < 2) return;
  const t0 = history[0].tick, t1 = history[history.length - 1].tick || 1;
  const maxN = Math.max(MAX_GRAZERS, ...history.map(p => p.n));
  // Each line is scaled to its own gene range so they all fit the same chart.
  const lines = [
    { c: '#f0c850', f: p => p.n / maxN },
    { c: '#ff4d4d', f: p => p.pred / PRED_CAP },
    { c: '#7fd3ff', f: p => (p.speed - 1) / 2 },
    { c: '#ff8fb1', f: p => (p.sense - 2) / 6 },
    { c: '#b6ff7f', f: p => (p.metabolism - 0.04) / 0.16 },
  ];
  const X = (p) => pad + (p.tick - t0) / (t1 - t0 || 1) * (w - 2 * pad);
  const Y = (v) => h - pad - clamp(v, 0, 1) * (h - 2 * pad);
  for (const L of lines) {
    cctx.strokeStyle = L.c;
    cctx.lineWidth = 2;
    cctx.beginPath();
    history.forEach((p, i) => {
      const x = X(p), y = Y(L.f(p));
      if (i === 0) cctx.moveTo(x, y); else cctx.lineTo(x, y);
    });
    cctx.stroke();
  }
}

seedInput.addEventListener('change', () => { newWorld(seedInput.value.trim() || '1'); draw(); });
document.getElementById('newSeed').addEventListener('click', () => {
  newWorld(String(Math.floor(Math.random() * 1e9))); draw();
});
pauseBtn.addEventListener('click', () => {
  paused = !paused; pauseBtn.textContent = paused ? 'play' : 'pause';
});
document.getElementById('csv').addEventListener('click', () => {
  const cols = ['tick', 'grazers', 'predators', 'births', 'deaths', 'eaten', 'speed', 'sense', 'metabolism'];
  const rows = history.map(p => [p.tick, p.n, p.pred, p.births, p.deaths, p.eaten, p.speed, p.sense, p.metabolism]
    .map(v => typeof v === 'number' && !Number.isInteger(v) ? v.toFixed(4) : v).join(','));
  const blob = new Blob([cols.join(',') + '\n' + rows.join('\n') + '\n'], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tiny-biome-${seedInput.value || 'run'}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

// Run loop: speed slider = steps per second.
let last = 0, acc = 0;
function loop(ts) {
  const dt = ts - last; last = ts;
  if (!paused) {
    acc += dt * speedInput.value / 1000;
    while (acc >= 1) { step(); acc -= 1; }
    draw();
  }
  requestAnimationFrame(loop);
}

newWorld((location.hash.slice(1)) || '42');
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
