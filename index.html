<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Biome Lab</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
  header { padding: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  canvas { image-rendering: pixelated; border: 1px solid #333; background: #000; }
  button, input { font: inherit; }
  #stats { font-variant-numeric: tabular-nums; padding: 6px; }
  footer { font-size: 12px; opacity: 0.6; padding: 8px; }
</style>
</head>
<body>
<header>
  <strong>Tiny Biome Lab</strong>
  <label>seed <input id="seed" size="10"></label>
  <button id="newSeed">new seed</button>
  <button id="pause">pause</button>
  <label>speed <input id="speed" type="range" min="1" max="30" value="8"></label>
</header>
<canvas id="world" width="80" height="50" style="width:800px;height:500px"></canvas>
<div id="stats"></div>
<footer>Same seed, same history. M1: grass, grazers, seeded world.</footer>

<script>
// Seeded PRNG (mulberry32): same seed always gives the same world.
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const W = 80, H = 50;
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');
const seedInput = document.getElementById('seed');
const speedInput = document.getElementById('speed');
const pauseBtn = document.getElementById('pause');

let rng, grass, grazers, tick, paused = false;

function hashSeed(str) {
  // Turns a text seed into a 32-bit number. Numbers pass through.
  if (/^\d+$/.test(str)) return parseInt(str, 10);
  let h = 2166136261;
  for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return h >>> 0;
}

function newWorld(seedText) {
  seedInput.value = seedText;
  location.hash = seedText;
  rng = makeRng(hashSeed(seedText));
  grass = new Float32Array(W * H);
  for (let i = 0; i < grass.length; i++) grass[i] = rng();
  grazers = [];
  for (let i = 0; i < 60; i++) {
    grazers.push({
      x: Math.floor(rng() * W), y: Math.floor(rng() * H),
      energy: 10,
      speed: 1 + Math.floor(rng() * 2),   // gene: cells per tick
      sense: 3 + Math.floor(rng() * 4),   // gene: how far it can see grass
      metabolism: 0.08 + rng() * 0.08,    // gene: energy used per tick
    });
  }
  tick = 0;
}

function wrap(v, max) { return (v + max) % max; }

function step() {
  tick++;
  // Grass regrows slowly.
  for (let i = 0; i < grass.length; i++) grass[i] = Math.min(1, grass[i] + 0.01);

  const next = [];
  for (const g of grazers) {
    // Look around for the richest grass cell in sense range.
    let bestX = g.x, bestY = g.y, bestVal = -1;
    for (let dy = -g.sense; dy <= g.sense; dy++) {
      for (let dx = -g.sense; dx <= g.sense; dx++) {
        const x = wrap(g.x + dx, W), y = wrap(g.y + dy, H);
        const v = grass[y * W + x];
        if (v > bestVal) { bestVal = v; bestX = x; bestY = y; }
      }
    }
    // Move toward it, up to speed cells per tick.
    for (let s = 0; s < g.speed; s++) {
      if (g.x !== bestX) g.x = wrap(g.x + Math.sign(bestX - g.x), W);
      else if (g.y !== bestY) g.y = wrap(g.y + Math.sign(bestY - g.y), H);
    }
    // Eat what is here.
    const idx = g.y * W + g.x;
    const eaten = Math.min(grass[idx], 0.5);
    grass[idx] -= eaten;
    g.energy += eaten * 4 - g.metabolism;
    if (g.energy > 0) next.push(g);
  }
  grazers = next;
}

function draw() {
  const img = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const gr = grass[i];
    img.data[i * 4] = 20;
    img.data[i * 4 + 1] = 40 + gr * 180;
    img.data[i * 4 + 2] = 20;
    img.data[i * 4 + 3] = 255;
  }
  for (const g of grazers) {
    const i = (g.y * W + g.x) * 4;
    img.data[i] = 240; img.data[i + 1] = 200; img.data[i + 2] = 80;
  }
  ctx.putImageData(img, 0, 0);
  const avgSpeed = grazers.length ? (grazers.reduce((s, g) => s + g.speed, 0) / grazers.length).toFixed(2) : '-';
  statsEl.textContent = `tick ${tick} | grazers ${grazers.length} | avg speed gene ${avgSpeed}`;
}

seedInput.addEventListener('change', () => { newWorld(seedInput.value.trim() || '1'); draw(); });
document.getElementById('newSeed').addEventListener('click', () => {
  newWorld(String(Math.floor(Math.random() * 1e9))); draw();
});
pauseBtn.addEventListener('click', () => {
  paused = !paused; pauseBtn.textContent = paused ? 'play' : 'pause';
});

// Run loop: speed slider = steps per second.
let last = 0, acc = 0;
function loop(ts) {
  const dt = ts - last; last = ts;
  if (!paused) {
    acc += dt * speedInput.value / 1000;
    while (acc >= 1) { step(); acc -= 1; }
    draw();
  }
  requestAnimationFrame(loop);
}

newWorld((location.hash.slice(1)) || '42');
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
